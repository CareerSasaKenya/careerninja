name: Scrape Enrich

# Schedules removed so this does not double-run with Vercel crons
# (enrich-jobs in vercel.json). Manual / admin dispatch still works.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'scraped = re-normalize published scraped jobs from raw_data; sparse = active jobs missing fields (any intake); tips = career tips for jobs posted in the last N days'
        required: false
        default: 'scraped'
        type: choice
        options:
          - scraped
          - sparse
          - tips
      source_id:
        description: 'Optional: only this scraper source (scraped mode only)'
        required: false
        type: string
      limit:
        description: 'Batch size (scraped/sparse default 10; tips default 80, max 200)'
        required: false
        default: '10'
        type: number
      days:
        description: 'Lookback days for tips mode (default 7)'
        required: false
        default: '7'
        type: number

permissions:
  contents: read

concurrency:
  group: scrape-enrich
  cancel-in-progress: false

jobs:
  enrich:
    name: Enrich jobs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPER_USER_ID: ${{ secrets.SCRAPER_USER_ID }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_API_KEY_2: ${{ secrets.DEEPSEEK_API_KEY_2 }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enrich jobs
        env:
          MODE: ${{ github.event.inputs.mode }}
          SOURCE_ID: ${{ github.event.inputs.source_id }}
          LIMIT: ${{ github.event.inputs.limit }}
          DAYS: ${{ github.event.inputs.days }}
        run: |
          MODE="${MODE:-sparse}"
          if [ "$MODE" = "tips" ]; then
            TIPS_LIMIT="${LIMIT}"
            # Shared workflow default is 10 (scraped/sparse). Treat that as 80 for tips.
            if [ -z "$TIPS_LIMIT" ] || [ "$TIPS_LIMIT" = "10" ]; then TIPS_LIMIT=80; fi
            npm run worker:enrich -- tips "$TIPS_LIMIT" "${DAYS:-7}"
          else
            ARGS="${MODE} ${LIMIT:-10}"
            if [ -n "$SOURCE_ID" ]; then ARGS="$ARGS $SOURCE_ID"; fi
            npm run worker:enrich -- $ARGS
          fi
