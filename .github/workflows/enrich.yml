name: Scrape Enrich

on:
  schedule:
    # Every 4h tick with a 0–90 min randomized jitter so runs are never
    # clock-aligned. Scheduled runs default to `sparse` mode — the same safe
    # AI-enrich-sparse-jobs cadence the old Vercel enrich-jobs cron used.
    - cron: '30 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'scraped = re-normalize published scraped jobs from raw_data; sparse = active jobs missing fields (any intake)'
        required: false
        default: 'scraped'
        type: choice
        options:
          - scraped
          - sparse
      source_id:
        description: 'Optional: only this scraper source (scraped mode only)'
        required: false
        type: string
      limit:
        description: 'Batch size (default 10, max 15)'
        required: false
        default: '10'
        type: number

permissions:
  contents: read

concurrency:
  group: scrape-enrich
  cancel-in-progress: false

jobs:
  enrich:
    name: Enrich jobs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPER_USER_ID: ${{ secrets.SCRAPER_USER_ID }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_API_KEY_2: ${{ secrets.DEEPSEEK_API_KEY_2 }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}

    steps:
      - name: Randomize scheduled tick timing
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            sleep $(( RANDOM % 5400 )) # 0–90 min jitter
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enrich jobs
        env:
          MODE: ${{ github.event_name == 'schedule' && 'sparse' || github.event.inputs.mode }}
          SOURCE_ID: ${{ github.event.inputs.source_id }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          ARGS="enrich ${MODE:-sparse}"
          ARGS="$ARGS ${LIMIT:-10}"
          if [ -n "$SOURCE_ID" ]; then ARGS="$ARGS $SOURCE_ID"; fi
          npm run worker:enrich -- $ARGS
